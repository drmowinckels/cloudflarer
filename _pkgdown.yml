url: http://drmowinckels.io/cloudflarer/
template:
  bootstrap: 5
reference:
  - title: Authentication
    desc: Configure and verify Cloudflare credentials (API token or Global API Key).
    contents:
      - cf_auth_mode
      - cf_has_auth
      - cf_token
      - cf_email
      - cf_api_key
      - cf_verify
      - cf_token_verify
      - cf_sitrep
  - title: Generic requests
    desc: |
      Low-level helpers used by every wrapper. Use these directly to call endpoints the package does not yet provide a function for.
    contents:
      - cf_request
      - cf_resp
      - cf_collect
      - cf_graphql
  - title: User
    contents: cf_user
  - title: Accounts
    contents:
      - starts_with("cf_list_accounts")
      - cf_get_account
  - title: Zones and zone settings
    contents:
      - contains("zone")
      - -cf_zone_overview
      - -cf_zone_requests
  - title: DNS records
    contents:
      - contains("dns_record")
  - title: Page Rules
    contents:
      - contains("page_rule")
  - title: Firewall rules
    contents: cf_list_firewall_rules
  - title: Rulesets
    desc: |
      Modern unified rule management (custom rules, transforms, managed firewall, redirects, cache rules, rate limits).
    contents:
      - contains("ruleset")
  - title: Cache
    contents: cf_purge_cache
  - title: Healthchecks
    contents:
      - contains("healthcheck")
  - title: SSL/TLS
    desc: |
      Certificate packs (universal/advanced/custom) and SSL-for-SaaS custom hostnames.
    contents:
      - contains("certificate_pack")
      - contains("custom_hostname")
  - title: D1 (serverless SQL)
    contents:
      - contains("d1_database")
      - cf_d1_query
  - title: Workers
    contents:
      - cf_list_workers_scripts
      - cf_get_workers_script
      - cf_workers_invocations
      - cf_list_kv_namespaces
      - cf_get_kv_namespace
      - cf_create_kv_namespace
      - cf_rename_kv_namespace
      - cf_delete_kv_namespace
      - cf_list_kv_keys
      - cf_get_kv_value
      - cf_put_kv_value
      - cf_delete_kv_value
      - cf_put_kv_values
      - cf_delete_kv_values
  - title: Pages
    contents:
      - cf_list_pages_projects
      - cf_get_pages_project
      - cf_list_pages_deployments
  - title: R2
    contents:
      - cf_list_r2_buckets
      - cf_get_r2_bucket
  - title: Turnstile (CAPTCHA replacement)
    contents:
      - contains("turnstile")
  - title: Email Routing
    contents:
      - contains("email_routing")
  - title: Tunnels (Zero Trust / cloudflared)
    contents:
      - cf_list_tunnels
      - cf_get_tunnel
      - cf_list_tunnel_connections
  - title: Web Analytics (RUM)
    contents:
      - contains("rum_")
  - title: GraphQL Analytics convenience
    desc: |
      Tidy data.frame wrappers built on top of cf_graphql().
    contents:
      - cf_zone_overview
      - cf_zone_requests
      - cf_cache_ratio
      - cf_dns_queries
      - cf_firewall_events_by_day
      - cf_firewall_events_top
  - title: Helpers
    contents: cf_records_to_df
navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - news
    right:
      - search
      - github
  components:
    articles:
      text: Articles
      menu:
        - text: Cheatsheet
          href: articles/cheatsheet.html
        - text: Authentication
          href: articles/authentication.html
        - text: Website analytics
          href: articles/analytics.html
